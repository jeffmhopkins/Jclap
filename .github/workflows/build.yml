name: build

on:
  # Branches get CI from their pull request, so only main and release tags build on push. Building
  # every branch push as well ran each PR commit twice.
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v0.1.0"
        required: true

# A new push to a PR (or to main) cancels the run it replaces. Tags and manual releases always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

jobs:
  # Changes that only touch docs (Markdown, the manuals) skip the build. The build job then shows
  # as skipped, which counts as passing. Releases always build.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!**/*.pdf'
              - '!**/docs/manual/**'
              - '!**/docs/readme/**'

  build:
    needs: changes
    if: >
      needs.changes.outputs.code == 'true' || startsWith(github.ref, 'refs/tags/v')
      || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # MSVC compiles a project's files in parallel with /MP; the build step's --parallel only runs
      # projects side by side. Spelled -MP, since Git Bash (which runs Configure) turns /MP into a path.
      CFLAGS: ${{ matrix.os == 'windows-latest' && '-MP' || '' }}
      CXXFLAGS: ${{ matrix.os == 'windows-latest' && '-MP' || '' }}
    steps:
      - uses: actions/checkout@v4
      # Visage (the jclap::ui GUI library) needs X11 and OpenGL headers on Linux. The software Vulkan
      # driver lets the screenshot tests render panels without a GPU.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libgl1-mesa-dev mesa-vulkan-drivers libvulkan1
      # Build and test on every core the runner has (make and ctest default to one).
      - name: Use every core
        shell: bash
        run: |
          cores=$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$cores" >> "$GITHUB_ENV"
          echo "CTEST_PARALLEL_LEVEL=$cores" >> "$GITHUB_ENV"
      # Compiler cache for Linux and macOS (MSVC's Visual Studio generator can't use one). Only main
      # saves it, so PRs start from main's objects without filling the repo's cache quota.
      - name: ccache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}
          max-size: 1G
          save: ${{ github.ref == 'refs/heads/main' }}
      # The fetched sources (bgfx alone is a 600 MB clone). FetchContent re-fetches any whose tag
      # changed, so an older cache is still a good start.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', '**/CMakeLists.txt', '**/patches/**') }}
          restore-keys: deps-${{ runner.os }}-
      # The template is built and tested everywhere; screenshot tests (JCLAP_BUILD_TOOLS) run on Linux,
      # where rendering matches the committed reference images.
      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DJCLAP_BUILD_TEMPLATE=ON ${{ runner.os == 'Linux' && '-DJCLAP_BUILD_TOOLS=ON' || '' }}
          ${{ runner.os != 'Windows' && '-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache' || '' }}
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      # Package on each runner so file permissions survive (artifact uploads drop them).
      - name: Sign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - build/clap/*.clap build/template/*.clap build/vst3/*.vst3
          codesign --verify --strict --verbose=2 build/clap/*.clap build/vst3/*.vst3
      - name: Check minimum macOS version
        if: runner.os == 'macOS'
        run: |
          for bin in build/clap/*.clap/Contents/MacOS/* build/vst3/*.vst3/Contents/MacOS/*; do
            vtool -show-build "$bin"
            # arm64 can't go below 11.0, so accept 10.x or 11.x and fail on anything newer.
            if vtool -show-build "$bin" | awk '/minos/ {split($2, v, "."); if (v[1] > 11) bad=1} END {exit !bad}'; then
              echo "::error::$bin requires a newer macOS than 11"; exit 1
            fi
          done
          find build/clap build/vst3 -maxdepth 3 | sort
      # The official CLAP validator loads each plugin the way a host does and checks it against the spec.
      - name: Cache clap-validator
        id: clap-validator
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/clap-validator*
          key: clap-validator-0.4.1-${{ runner.os }}
      - name: Install clap-validator
        if: steps.clap-validator.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/free-audio/clap-validator --tag 0.4.1 clap-validator
      - name: Validate plugins
        shell: bash
        run: |
          for p in build/clap/*.clap build/template/*.clap; do
            clap-validator validate --only-failed "$p"
          done
      # Steinberg's validator does the same for the VST3s. It is built from the SDK the wrapper uses.
      - name: Build VST3 validator
        shell: bash
        run: |
          cmake -S build/_deps/vst3sdk-src -B build/vst3-validator -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_ADD_VSTGUI=OFF \
            -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF \
            -DSMTG_ADD_VST3_PLUGINS_SAMPLES=OFF -DSMTG_ADD_VST3_HOSTING_SAMPLES=OFF -DSMTG_RUN_VST_VALIDATOR=OFF \
            ${{ runner.os != 'Windows' && '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache' || '' }}
          cmake --build build/vst3-validator --config Release --target validator
      - name: Validate VST3s
        shell: bash
        run: |
          validator=$(find build/vst3-validator/bin -type f \( -name validator -o -name validator.exe \) | head -n 1)
          # Without its thousands of program-list lines, so a failure is easy to find in the log.
          set -o pipefail
          for p in build/vst3/*.vst3; do
            "$validator" "$p" 2>&1 | grep -v 'Programlist'
          done
      # The collection zips keep fixed names, so the installer and "latest" links always find them.
      # The one-plugin zips carry that plugin's version.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          versions=$(.github/plugin-versions.sh list)
          version() { awk -v n="$1" '$2 == n { print $3 }' <<< "$versions"; }
          mkdir dist
          ditto -c -k --sequesterRsrc build/clap "dist/jclap-${{ runner.os }}.zip"
          # One zip per plugin as well, for anyone who only wants one of them.
          for p in build/clap/*.clap; do
            name=$(basename "$p" .clap)
            ditto -c -k --sequesterRsrc --keepParent "$p" "dist/jclap-$name-$(version "$name")-${{ runner.os }}.zip"
          done
          # VST3s get their own zips, so the CLAP zips still unpack straight into the CLAP folder.
          ditto -c -k --sequesterRsrc build/vst3 "dist/jclap-VST3-${{ runner.os }}.zip"
          for p in build/vst3/*.vst3; do
            name=$(basename "$p" .vst3)
            ditto -c -k --sequesterRsrc --keepParent "$p" "dist/jclap-$name-$(version "$name")-VST3-${{ runner.os }}.zip"
          done
      - name: Package
        if: runner.os != 'macOS'
        shell: bash
        run: |
          versions=$(.github/plugin-versions.sh list)
          version() { awk -v n="$1" '$2 == n { print $3 }' <<< "$versions"; }
          mkdir dist
          cd build/clap
          cmake -E tar cf "../../dist/jclap-${{ runner.os }}.zip" --format=zip -- *.clap
          for p in *.clap; do
            cmake -E tar cf "../../dist/jclap-${p%.clap}-$(version "${p%.clap}")-${{ runner.os }}.zip" --format=zip -- "$p"
          done
          cd ../vst3
          cmake -E tar cf "../../dist/jclap-VST3-${{ runner.os }}.zip" --format=zip -- *.vst3
          for p in *.vst3; do
            cmake -E tar cf "../../dist/jclap-${p%.vst3}-$(version "${p%.vst3}")-VST3-${{ runner.os }}.zip" --format=zip -- "$p"
          done
      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: jclap-${{ runner.os }}
          path: dist/*.zip

  # Each plugin has its own version (jclap_plugin_version in its CMakeLists.txt). A plugin changed
  # since the last release but still on that release's version gets a warning on pull requests and
  # main, and stops a release.
  plugin-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check plugin versions
        run: >
          .github/plugin-versions.sh check
          ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && 'error' || 'warning' }}

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build, plugin-versions]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The whole history, so the notes can say which plugins are new since the last release.
      - uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0
      - name: Render install notes
        run: src/.github/plugin-versions.sh notes "${{ inputs.version || github.ref_name }}" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*.zip
          body_path: notes.md
          generate_release_notes: true

  # Every push to main replaces the "dev" pre-release with that commit's build, for testing before a
  # real release. It's marked pre-release, so "latest" and the README's links still point at the last
  # tagged version.
  dev-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: dev-release
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0
      - name: Render install notes
        run: |
          {
            echo "Development build of \`${GITHUB_SHA::7}\` on main. Not a release: it's replaced by each push to main."
            echo
            src/.github/plugin-versions.sh notes dev
          } > notes.md
      - name: Replace the dev release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev dist/*.zip --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "dev (${GITHUB_SHA::7})" --notes-file notes.md
