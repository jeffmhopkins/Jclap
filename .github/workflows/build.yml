name: build

on:
  push:
    tags: ["v*"]
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v0.1.0"
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Visage (the jclap::ui GUI library) needs X11 and OpenGL headers on Linux.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      # Package on each runner so file permissions survive (artifact uploads drop them).
      - name: Sign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - build/clap/*.clap
          codesign --verify --strict --verbose=2 build/clap/*.clap
      - name: Check minimum macOS version
        if: runner.os == 'macOS'
        run: |
          for bin in build/clap/*.clap/Contents/MacOS/*; do
            vtool -show-build "$bin"
            # arm64 can't go below 11.0, so accept 10.x or 11.x and fail on anything newer.
            if vtool -show-build "$bin" | awk '/minos/ {split($2, v, "."); if (v[1] > 11) bad=1} END {exit !bad}'; then
              echo "::error::$bin requires a newer macOS than 11"; exit 1
            fi
          done
          find build/clap -maxdepth 3 | sort
      # The official CLAP validator loads each plugin the way a host does and checks it against the spec.
      - name: Install clap-validator
        run: cargo install --locked --git https://github.com/free-audio/clap-validator --tag 0.4.1 clap-validator
      - name: Validate plugins
        shell: bash
        run: |
          for p in build/clap/*.clap; do
            clap-validator validate --only-failed "$p"
          done
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dist
          ditto -c -k --sequesterRsrc build/clap "dist/jclap-${{ runner.os }}.zip"
      - name: Package
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir dist
          cd build/clap
          cmake -E tar cf "../../dist/jclap-${{ runner.os }}.zip" --format=zip -- *.clap
      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: jclap-${{ runner.os }}
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Render install notes
        run: sed "s/{{VERSION}}/${{ inputs.version || github.ref_name }}/g" src/.github/release-notes.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*.zip
          body_path: notes.md
          generate_release_notes: true
