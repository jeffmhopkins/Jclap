name: build

on:
  push:
    tags: ["v*"]
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v0.1.0"
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: jclap-${{ runner.os }}
          path: build/clap/

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Zip plugins
        run: |
          cd dist
          for d in jclap-*; do (cd "$d" && zip -r "../$d.zip" .); done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*.zip
          generate_release_notes: true
